# Laisse plus de temps au scan du dossier (dépassait 30ms au démarrage de kitty)
scan_timeout = 200

## FIRST LINE/ROW: Info & Status
# First param ─┌
[username]
format = " [╭─$user]($style)@"
show_always = true
style_root = "#ff5400"
style_user = "#ff5400"

# Second param
[hostname]
disabled = false
format = "[$hostname]($style) in "
ssh_only = false
style = "#BC5C2A"
trim_at = "-"

# Third param
[directory]
style = "#98C3AF"
truncate_to_repo = true
truncation_length = 0
truncation_symbol = "repo: "

# Fourth param
[sudo]
disabled = false

# Before all the version info (python, nodejs, php, etc.)
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
deleted = "x"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
style = "#DADD94"

[git_metrics]
disabled = false
added_style = "#78AA91"
deleted_style = "#ff5400"
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_commit]
commit_hash_length = 7
tag_symbol = "🏷 "

[memory_usage]
disabled = false
threshold = 75
format = "via $symbol [${ram_pct}]($style) "
symbol = "🐏 "
style = "#D9D087"

[container]
format = '[$symbol \[$name\]]($style) '
symbol = "⬢"

[rust]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "#ff5400"

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"

# Last param in the first line/row
[cmd_duration]
disabled = false
format = "took [$duration]($style)"
min_time = 1


## SECOND LINE/ROW: Prompt
# Somethere at the beginning
[battery]
charging_symbol = ""
disabled = true
discharging_symbol = ""
full_symbol = ""

[[battery.display]]  # "bold red" style when capacity is between 0% and 10%
disabled = false
style = "#C5CB3A"
threshold = 15

[[battery.display]]  # "bold yellow" style when capacity is between 10% and 30%
disabled = true
style = "#DADD94"
threshold = 50

[[battery.display]]  # "bold green" style when capacity is between 10% and 30%
disabled = true
style = "#94982C"
threshold = 80

# Prompt: optional param 1
[time]
disabled = true
format = " 🕙 $time($style)\n"
style = "#DADD94"
time_format = "%T"

# Prompt: param 2
[character]
error_symbol = " [×](#989A68)"
success_symbol = " [╰─](#98C3AF)"

# SYMBOLS
[status]
disabled = false
format = '[\[$symbol$status_common_meaning$status_signal_name$status_maybe_int\]]($style)'
map_symbol = true
pipestatus = true
symbol = "🔴"

[aws]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "

[golang]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[nim]
