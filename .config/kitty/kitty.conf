font_family     Fira Code SemiBold
font_features   FiraCode-SemiBold +ss01 +ss02 +ss03 +ss05 +cv01
font_size 	    13.0
bold_font        	auto
italic_font      	auto
bold_italic_font 	auto

enabled_layouts *
allow_remote_control yes
# socket de pilotage par fenêtre : `kitty @` depuis nvim passe par lui (sinon nvim, qui lit le
# terminal, avale la réponse de kitty) — utilisé pour couper le shader matrix dans nvim
listen_on unix:@kitty-{kitty_pid}

confirm_os_window_close 0

# kitty 0.49+ mémorise aussi l'état maximisé -> ouvrait en fullscreen sous Hyprland
remember_window_size no

# ── kitty 0.49 ────────────────────────────────────────────────────────────────
# Traînée de curseur aux couleurs du wallpaper (shader généré par wallust :
# templates/kitty-cursor-trail.slang -> ~/.config/kitty/shaders/)
cursor_trail                 3
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 2
custom_shaders               matrix-wallust cursor-trail-wallust

# Un peu d'air autour du texte ; les marges prennent la couleur des cellules
# voisines (nvim, btop... sans liseré de couleur de fond)
window_padding_width  4 6
padding_fill_strategy neighboring_cell

# Scrollbar visible en scrollant OU en survolant le bord droit
scrollbar scrolled-or-hovered

# Ctrl+glisser une sélection vers une autre appli (sélection normale inchangée)
mouse_map left press ungrabbed mouse_selection normal
mouse_map ctrl+left press ungrabbed mouse_selection drag_or_normal_select

foreground         #FCF4FA
background         #150000
background_opacity 0.7
cursor             #B7818C

selection_foreground #00ecff
selection_background #F5FBFF

active_tab_foreground     #150000
active_tab_background     #FCF4FA
inactive_tab_foreground   #FCF4FA
inactive_tab_background   #150000

active_border_color   #FCF4FA
inactive_border_color #150000
bell_border_color     #F6DFF0

color0    #150000
color1		#510A16
color2		#CF1D39
