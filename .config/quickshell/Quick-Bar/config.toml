# Quick-Bar — réglages généraux.
# Enregistré = appliqué tout de suite (pas besoin de redémarrer).
# Une valeur absente ou une erreur de syntaxe → la valeur par défaut est gardée.

[touchpanel]
# Zoom de toutes les pages du panneau tactile (1.0 = 100 %, 1.2 = 120 %…).
# Tout grossit ensemble : textes, curseurs, boutons, vignettes.
scale = 1.0

# Zoom par page, multiplié par le zoom global ci-dessus.
# Clés = celles des onglets : game home grid ws stats kanban files wall colors eq
#        mixer discord deck games rgb
[touchpanel.pages]
wall   = 1    # réglages et vignettes de l'onglet Wall
stats  = 1.15
kanban = 1.15
files  = 1.60

[fonts]
# Police et tailles de base du thème (barre, dashboard, textes qui suivent le thème).
# Attention : beaucoup d'éléments ont une taille fixe ; pour tout agrandir sur le
# panneau tactile, utiliser plutôt les zooms ci-dessus.
family = "CaskaydiaCove Nerd Font"
body   = 16
small  = 14

[health]
# Adresse du serveur Proxmox vérifiée par l'onglet Santé (vide = pas de vérification).
proxmox = "192.168.1.200"
skip = ["discord", "easyeffects"]

[[health.custom]]
name = "Jellyfin"
type = "url"
target = "http://192.168.1.150:8096"

[[health.custom]]
name = "Hyprland"
type = "process"
target = "Hyprland"
fix = "setsid -f Hyprland >/dev/null 2>&1"

[[health.custom]]
name = "start-hyprland"
type = "process"
target = "start-hyprland"
fix = "setsid -f start-hyprland >/dev/null 2>&1"

[[health.custom]]
name = "Samsung_Game"
type = "mount"
target = "/home/florian/Samsung_Game"
fix = "pkexec mount /home/florian/Samsung_Game"

[[health.custom]]
name = "Batterie de la souris > 20 %"
type = "command"
target = "[ $(cat /sys/class/power_supply/hidpp_battery_0/capacity 2>/dev/null || echo 100) -gt 20 ]"

[[health.custom]]
name = "Github"
type = "url"
target = "https://github.com/Eaquo"
[wallpaper]
# Dossier des wallpapers (galerie de l'onglet Wall, bouton Aléatoire, rotation auto).
dir    = "~/Pictures/wallpapers"
# Vidéos (gslapper). Par défaut : sous-dossier Video du dossier ci-dessus.
videos = "~/Pictures/wallpapers/Video"

[theme]
palette = "matugen"
matugen_prefer = "value"
matugen_mode = "dark"
accent = "color13"
border_speed = 2
radius = 14

[bar]
radius = 19
height = 38
top_margin = 7

[bar.layout]
left = ["launcher", "stats"]
center = ["notifications", "cava", "clock", "workspaces", "minimized", "layout", "localsend"]
right = ["updates", "proxmox", "tray", "audio", "power"]

[general]
# Profil affiché dans l'accueil (nom vide = $USER, avatar par défaut ~/.face)
avatar = "~/Eaquo_Assets/Edited Image.jpg"
# Terminal des actions de la barre (kitty, foot, alacritty, ghostty, wezterm, konsole…)

[refresh]
health = 3600
localsend = 30

[dashboard]
tabs = ["home", "stats", "battery", "kanban", "files", "wall", "eq"]
height = 540

[game]
eq_preset = "HP"

[session]

[overview]
scale = 0.4

[apps]
tile_size = 155
labels = false
launcher_style = "hive"

[menu]
style = "minimal"
apps_layout = "hive"

[lock]
auto_minutes = 10

